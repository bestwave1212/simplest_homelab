services:
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    container_name: opencode
    ports:
      - "4096:4096"
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c", "printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/xdg-open && chmod +x /usr/local/bin/xdg-open && exec opencode web --hostname 0.0.0.0 --port 4096"]
    stdin_open: true
    tty: true
