services:
  rsyncd:
    image: alpine:latest
    container_name: rsyncd-server
    restart: unless-stopped
    network_mode: host
    volumes:
      - /mnt/data/backup/stationmir:/data
      - ./rsyncd.conf:/etc/rsyncd.conf:ro
      - ./rsyncd.secrets:/etc/rsyncd.secrets:ro
    command: sh -c "apk add --no-cache rsync && rsync --daemon --no-detach"